<div class="cs-project-tools"><a class="cm-text-link" href="#/app">← 创作空间</a><select id="projects" aria-label="切换漫画工程"></select><button id="new">新建漫画</button></div><section class="intro"><p class="eyebrow">漫画作品</p><h1 id="title">我的新漫画</h1><p>先讲好故事，再安排画面。每一步都可以回去改。</p><p id="save" role="status">正在读取工程</p></section><nav id="steps" aria-label="漫画创作四阶段"></nav><main><section id="stage"></section><section id="editing" hidden><div class="sectionHead"><div><h2 id="editTitle">先看看这一页</h2><p id="artStatus" role="status"></p></div><div id="pageTabs"></div></div><div class="editorGrid"><div class="artColumn"><div id="paper"><canvas id="canvas" width="1024" height="1536" aria-label="当前漫画及独立文字"></canvas><div id="handles"></div></div></div><aside><section class="panel"><h3>对白与气泡</h3><label>选择文字<select id="letter"></select></label><label>文字内容<textarea id="letterText" rows="3"></textarea></label><label>字号<input id="letterSize" type="number" min="8" max="100"></label><p class="hint">点选画面气泡，直接拖动。改字不需要生图。</p><details><summary>气泡与位置</summary><div id="letterAdvanced"></div></details><p id="letterWarning" class="hint" role="status"></p></section><section class="panel"><h3>画面调优</h3><label>本页上传替换图<input id="uploadArt" type="file" accept="image/png,image/jpeg,image/webp"></label><details><summary>单格调整</summary><label>选择画格<select id="panelTarget"></select></label><label>本格替换图<input id="uploadPanel" type="file" accept="image/png,image/jpeg,image/webp"></label><label>本格取景<input id="panelZoom" type="range" min="1" max="2" step="0.01" value="1"></label></details><div id="sampleTune"><label>取景<input id="cropZoom" type="range" min="1" max="2" step="0.01"></label><button id="cropLeft">← 取景</button><button id="cropRight">取景 →</button><button id="cropReset">还原取景</button><details id="faceTune"><summary>旧样例表情候选</summary><div class="faces"><figure><img src="comic-page-proof/assets/face-original.png" alt="周叔原版"><figcaption>原版</figcaption></figure><figure><img src="comic-page-proof/assets/face-candidate.png" alt="周叔微笑候选"><figcaption>预制候选 · 略显年轻</figcaption></figure></div><button id="facePreview">临时比较候选</button><button id="faceAdopt">采用候选</button><button id="faceOriginal">使用原版</button><p id="faceStatus" class="hint" role="status"></p></details></div><p class="hint">上传整页或返回编排替换单格；原型未接实时生图。</p></section><button id="editPreview">通读并导出 →</button></aside></div></section><section id="reader" hidden><div class="sectionHead"><div><h2>从头读一遍</h2><p id="readerStatus" role="status"></p></div><button id="makePNGs" class="primary">合成全部 PNG</button></div><div id="readerPages"></div><div id="exports" class="exports" role="status"></div></section><div class="bottom"><button id="back">← 上一步</button><span id="stepHint"></span><button id="continue" class="primary">继续 →</button></div><footer>内容与视觉资产仅保存在当前漫画；实时AI生成尚未接入。</footer></main>
