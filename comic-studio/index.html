<!doctype html><html lang="zh-CN"><head><script src="../portable-resources.js"></script><script src="../portable-media.js"></script><script src="../portable-seed.js"></script><script src="../portable-boot.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cimora · 漫画创作</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../cimora-comic-studio.css?v=20261106-assetlinks1"></head><body><header><a href="../index.html#/app" class="brand">CIMORA <span>漫画创作</span></a><div><select id="projects" aria-label="切换漫画工程"></select><button id="new">新建故事</button></div></header><section class="intro"><p class="eyebrow">从一句灵感，走到你的第一部漫画</p><h1 id="title">借一把晴天</h1><p>先讲好故事，再安排画面。每一步都可以回去改。</p><p id="save" role="status">准备中</p></section><nav id="steps" aria-label="漫画创作六步"></nav><main><section id="stage"></section><section id="editing" hidden><div class="sectionHead"><div><h2 id="editTitle">先看看这一页</h2><p id="artStatus" role="status"></p></div><div id="pageTabs"></div></div><div class="editorGrid"><div class="artColumn"><div id="paper"><canvas id="canvas" width="1024" height="1536" aria-label="当前漫画及独立文字"></canvas><div id="handles"></div></div></div><aside><section class="panel"><h3>对白与气泡</h3><label>选择文字<select id="letter"></select></label><label>文字内容<textarea id="letterText" rows="3" maxlength="300"></textarea></label><label>字号<input id="letterSize" type="number" min="8" max="100"></label><p class="hint">点选画面气泡，直接拖动。改字不需要生图。</p><details><summary>气泡与位置</summary><div id="letterAdvanced"></div></details><p id="letterWarning" class="hint" role="status"></p></section><section class="panel"><h3>画面调优</h3><label>本页上传替换图<input id="uploadArt" type="file" accept="image/png,image/jpeg,image/webp"></label><div id="sampleTune"><label>雨景取景<input id="cropZoom" type="range" min="1" max="2" step="0.01"></label><button id="cropLeft">← 取景</button><button id="cropRight">取景 →</button><button id="cropReset">还原取景</button><details><summary>周叔表情候选</summary><div class="faces"><figure><img src="../comic-page-proof/assets/face-original.png" alt="周叔原版"><figcaption>原版</figcaption></figure><figure><img src="../comic-page-proof/assets/face-candidate.png" alt="周叔微笑候选"><figcaption>预制候选 · 略显年轻</figcaption></figure></div><button id="facePreview">临时比较候选</button><button id="faceAdopt">采用候选</button><button id="faceOriginal">使用原版</button><p id="faceStatus" class="hint" role="status"></p></details></div><p class="hint">取景和候选只在样例第一场开放；其他修图可上传替换。此原型没有实时生图接口。</p></section><button id="editPreview">通读并导出 →</button></aside></div></section><section id="reader" hidden><div class="sectionHead"><div><h2>从头读一遍</h2><p id="readerStatus" role="status"></p></div><button id="makePNGs" class="primary">合成全部 PNG</button></div><div id="readerPages"></div><div id="exports" class="exports" role="status"></div></section><div class="bottom"><button id="back">← 上一步</button><span id="stepHint"></span><button id="continue" class="primary">继续 →</button></div><footer>本机操作原型 · 样例画面为已有真实素材，页面不实时联网生成。旧空间和各实验独立保留。<details><summary>查看早期实验</summary><a href="../comic-lab/index.html">独立漫画实验</a> · <a href="../comic-page-proof/index.html">页漫编辑验证</a> · <a href="../comic-director-proof/index.html">导演规划验证</a></details></footer></main><script src="../comic-lab/model.js"></script><script src="../comic-lab/sample.js"></script><script src="../comic-director-proof/model.js"></script><script src="../comic-page-proof/model.js"></script><script src="model.js"></script><script src="render.js"></script><script src="episode-planning.js"></script><script src="body-pagination.js?v=20261106-assetlinks1"></script><script src="whole-page-studio.js"></script><script src="../creation-workbench.js?v=20261106-assetlinks1"></script><script src="app.js?v=20261106-shared1"></script></body></html>
